<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teachers Management</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<header class="admin-header">

<h2>👨‍🏫 Teachers Management</h2>

<a href="dashboard.html" class="login-btn">

Dashboard

</a>

</header>

<div class="container">

<div class="login-box">

<h3>Add Teacher</h3>

<form id="teacherForm">

<div class="input-group">

<label>Teacher Name</label>

<input
type="text"
id="teacherName"
placeholder="Enter Teacher Name"
required>

</div>

<div class="input-group">

<label>Designation</label>

<input
type="text"
id="teacherDesignation"
placeholder="Enter Designation"
required>

</div>

<div class="input-group">

<label>Qualification</label>

<input
type="text"
id="teacherQualification"
placeholder="Enter Qualification"
required>

</div>

<div class="input-group">

<label>Phone Number</label>

<input
type="tel"
id="teacherPhone"
placeholder="Enter Phone Number">

</div>

<div class="input-group">

<label>Email Address</label>

<input
type="email"
id="teacherEmail"
placeholder="Enter Email Address">

</div>

<div class="input-group">

<label>Teacher Photo</label>

<input
type="file"
id="teacherPhoto"
accept="image/*">

</div>

<img
id="previewImage"
style="width:120px;display:none;margin:15px auto;border-radius:10px;">

<button
type="submit"
class="login-btn">

Save Teacher

</button>

</form>

</div>

<br>

<div class="login-box">

<h3>Teachers List</h3>

<div id="teacherList">

<p>No Teacher Found.</p>

</div>

</div>

</div>

<script type="module" src="firebase.js"></script>

<script type="module" src="storage.js"></script>

<script type="module" src="database.js"></script>

<script src="admin.js"></script>

</body>

  </html>
