<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Results Management</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<header class="admin-header">

<h2>📊 Results Management</h2>

<a href="dashboard.html" class="login-btn">

Dashboard

</a>

</header>

<div class="container">

<div class="login-box">

<h3>Add New Result</h3>

<form id="resultForm">

<div class="input-group">

<label>Student Name</label>

<input
type="text"
id="studentName"
placeholder="Student Name"
required>

</div>

<div class="input-group">

<label>Roll Number</label>

<input
type="number"
id="rollNumber"
placeholder="Roll Number"
required>

</div>

<div class="input-group">

<label>Class</label>

<input
type="text"
id="studentClass"
placeholder="Class"
required>

</div>

<div class="input-group">

<label>Exam Name</label>

<input
type="text"
id="examName"
placeholder="Exam Name"
required>

</div>

<div class="input-group">

<label>Total Marks</label>

<input
type="number"
id="totalMarks"
placeholder="Total Marks"
required>

</div>

<div class="input-group">

<label>Obtained Marks</label>

<input
type="number"
id="obtainedMarks"
placeholder="Obtained Marks"
required>

</div>

<div class="input-group">

<label>Grade</label>

<input
type="text"
id="grade"
placeholder="A+"
required>

</div>

<button
type="submit"
class="login-btn">

Save Result

</button>

</form>

</div>

<br>

<div class="login-box">

<h3>Published Results</h3>

<div id="resultsList">

<p>No Results Published.</p>

</div>

</div>

</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="database.js"></script>
<script type="module" src="admin.js"></script>

</body>
  </html>
